name: Build Atlas Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android app repository
        uses: actions/checkout@v4

      - name: Checkout current Atlas engine
        run: git clone --depth 1 https://github.com/12baro1/Atlas.git /tmp/Atlas

      - name: Copy Atlas analysis engine into the app
        run: |
          mkdir -p android/app/src/main/python
          rsync -a --prune-empty-dirs \
            --exclude='ai/***' \
            --exclude='tests/***' \
            --exclude='__pycache__/***' \
            --exclude='*.pyc' \
            --exclude='telegram*.py' \
            --exclude='atlas_tui.py' \
            --exclude='atlas_app.py' \
            --exclude='atlas_assistant.py' \
            --exclude='main.py' \
            --exclude='scanner.py' \
            --include='*/' \
            --include='*.py' \
            --exclude='*' \
            /tmp/Atlas/ android/app/src/main/python/
          python - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/python")
          for path in root.rglob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("Python syntax check passed")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/python
          if ! git diff --cached --quiet; then
            git commit -m "Import current Atlas analysis engine for Android"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
